<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Release Manager — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #0d0f10;
    --surface:   #161a1c;
    --border:    #252b2e;
    --border-hi: #3a4347;
    --text:      #d4dde2;
    --muted:     #5a6a72;
    --accent:    #00e5a0;
    --accent-dk: #00b87d;
    --warn:      #ff6b35;
    --mono:      'IBM Plex Mono', monospace;
    --sans:      'IBM Plex Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 6px;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .logo svg { width: 18px; height: 18px; }
  header h1 { font-family: var(--mono); font-size: 14px; font-weight: 600; letter-spacing: .04em; color: var(--text); }
  header .tag { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--border); padding: 3px 8px; border-radius: 4px; }

  /* ── Layout ── */
  main {
    flex: 1;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 40px 24px 60px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ── Current release card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .card-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .dot.live { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  .current-body {
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .meta-item label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .meta-item .val {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--text);
  }
  .meta-item .val.version { color: var(--accent); font-size: 18px; font-weight: 600; }
  .meta-item .val.none { color: var(--muted); font-style: italic; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-family: var(--mono);
    margin-top: 2px;
  }
  .pill.ok { background: rgba(0,229,160,.12); color: var(--accent); border: 1px solid rgba(0,229,160,.25); }
  .pill.missing { background: rgba(90,106,114,.1); color: var(--muted); border: 1px solid var(--border); }

  /* ── Upload form ── */
  .section-title {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .drop-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .drop-zone {
    border: 2px dashed var(--border-hi);
    border-radius: 10px;
    padding: 28px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    position: relative;
    text-align: center;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(0,229,160,.04);
  }
  .drop-zone.has-file {
    border-color: var(--accent);
    border-style: solid;
    background: rgba(0,229,160,.06);
  }
  .drop-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-icon {
    width: 40px; height: 40px;
    border-radius: 8px;
    display: grid; place-items: center;
    font-size: 20px;
  }
  .drop-icon.android { background: rgba(61,220,132,.12); }
  .drop-icon.windows { background: rgba(0,180,255,.12); }
  .drop-label { font-size: 13px; font-weight: 500; }
  .drop-ext {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .drop-filename {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    word-break: break-all;
    margin-top: 2px;
  }
  .drop-clear {
    position: absolute; top: 8px; right: 8px;
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 16px; line-height: 1;
    padding: 4px; border-radius: 4px;
    display: none;
  }
  .drop-clear:hover { color: var(--warn); }
  .has-file .drop-clear { display: block; }

  /* ── Description ── */
  textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    padding: 12px 14px;
    resize: vertical;
    min-height: 80px;
    outline: none;
    transition: border-color .2s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  /* ── Submit ── */
  .actions { display: flex; gap: 12px; align-items: center; }

  button.primary {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    font-family: var(--mono);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: .04em;
    padding: 12px 28px;
    cursor: pointer;
    transition: background .15s, transform .1s;
    display: flex; align-items: center; gap: 8px;
  }
  button.primary:hover { background: var(--accent-dk); }
  button.primary:active { transform: scale(.98); }
  button.primary:disabled { background: var(--border-hi); color: var(--muted); cursor: not-allowed; transform: none; }

  button.ghost {
    background: none;
    border: 1px solid var(--border-hi);
    color: var(--muted);
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 12px;
    padding: 11px 18px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  button.ghost:hover { border-color: var(--warn); color: var(--warn); }

  /* ── Progress ── */
  .progress-wrap {
    display: none;
    flex-direction: column;
    gap: 6px;
  }
  .progress-wrap.show { display: flex; }
  .progress-bar-bg {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width .2s;
  }
  .progress-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 28px; right: 28px;
    background: var(--surface);
    border: 1px solid var(--border-hi);
    border-radius: 10px;
    padding: 14px 20px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
    transform: translateY(20px);
    opacity: 0;
    transition: all .25s;
    max-width: 340px;
    z-index: 999;
  }
  #toast.show { transform: translateY(0); opacity: 1; }
  #toast.success { border-color: var(--accent); color: var(--accent); }
  #toast.error   { border-color: var(--warn);   color: var(--warn);   }

  /* ── Version preview badge ── */
  .version-preview {
    display: none;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
  }
  .version-preview.show { display: flex; }
  .version-preview span { color: var(--muted); }

  @media (max-width: 520px) {
    .drop-grid, .current-body { grid-template-columns: 1fr; }
    .actions { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
    </svg>
  </div>
  <h1>Release Manager</h1>
  <div class="tag">ADMIN</div>
</header>

<main>

  <!-- Current release status -->
  <div>
    <div class="section-title">Current Release</div>
    <div class="card" style="margin-top:10px">
      <div class="card-header">
        <div class="dot" id="liveDot"></div>
        <span id="liveLabel">No release published</span>
      </div>
      <div class="current-body">
        <div class="meta-item">
          <label>Version</label>
          <div class="val version" id="curVersion">—</div>
        </div>
        <div class="meta-item">
          <label>Published</label>
          <div class="val" id="curDate" style="font-size:13px">—</div>
        </div>
        <div class="meta-item">
          <label>Android</label>
          <div id="curAndroid"><span class="pill missing">not set</span></div>
        </div>
        <div class="meta-item">
          <label>Windows</label>
          <div id="curWindows"><span class="pill missing">not set</span></div>
        </div>
        <div class="meta-item" style="grid-column:1/-1">
          <label>Description</label>
          <div class="val" id="curDesc" style="font-size:13px; color:var(--muted)">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Upload form -->
  <div>
    <div class="section-title">Publish New Release</div>

    <div style="margin-top:10px; display:flex; flex-direction:column; gap:14px;">

      <!-- Drop zones -->
      <div class="drop-grid">
        <!-- Android -->
        <div class="drop-zone" id="dropAndroid">
          <input type="file" id="fileAndroid" accept=".apk" />
          <div class="drop-icon android">🤖</div>
          <div class="drop-label">Android APK</div>
          <div class="drop-ext">.apk</div>
          <div class="drop-filename" id="nameAndroid"></div>
          <button class="drop-clear" id="clearAndroid" type="button">✕</button>
        </div>
        <!-- Windows -->
        <div class="drop-zone" id="dropWindows">
          <input type="file" id="fileWindows" accept=".exe" />
          <div class="drop-icon windows">🪟</div>
          <div class="drop-label">Windows EXE</div>
          <div class="drop-ext">.exe</div>
          <div class="drop-filename" id="nameWindows"></div>
          <button class="drop-clear" id="clearWindows" type="button">✕</button>
        </div>
      </div>

      <!-- Version preview -->
      <div class="version-preview" id="versionPreview">
        <span>Detected version →</span>
        <strong id="detectedVer"></strong>
      </div>

      <!-- Description -->
      <textarea id="description" placeholder="Release notes / description (optional)…" rows="3"></textarea>

      <!-- Progress -->
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar-bg"><div class="progress-bar" id="progressBar"></div></div>
        <div class="progress-label" id="progressLabel">Uploading…</div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button class="primary" id="uploadBtn" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Publish Release
        </button>
        <button class="ghost" id="resetBtn" type="button">Reset meta</button>
      </div>

    </div>
  </div>

</main>

<div id="toast"></div>

<script>
// ── Helpers ───────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function parseVersion(name) {
  const m = name.match(/[v_\-]?(\d+\.\d+(?:\.\d+)?(?:\.\d+)?)/i);
  return m ? m[1] : null;
}

function showToast(msg, type = 'success') {
  const t = $('toast');
  t.textContent = msg;
  t.className = `show ${type}`;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = ''; }, 3500);
}

function fmt(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

// ── Load current meta ─────────────────────────────────────────────────────────
async function loadMeta() {
  try {
    const r = await fetch('/api/admin/meta');
    const m = await r.json();
    applyMeta(m);
  } catch { /* server might not be running in preview */ }
}

function applyMeta(m) {
  if (m.version) {
    $('liveDot').className = 'dot live';
    $('liveLabel').textContent = `v${m.version} live`;
    $('curVersion').textContent = `v${m.version}`;
  } else {
    $('liveDot').className = 'dot';
    $('liveLabel').textContent = 'No release published';
    $('curVersion').textContent = '—';
  }
  $('curDate').textContent    = fmt(m.updatedAt);
  $('curDesc').textContent    = m.description || '—';
  $('curAndroid').innerHTML   = m.androidUrl
    ? `<a class="pill ok" href="${m.androidUrl}" target="_blank">✓ ${m.androidUrl.split('/').pop()}</a>`
    : '<span class="pill missing">not set</span>';
  $('curWindows').innerHTML   = m.windowsUrl
    ? `<a class="pill ok" href="${m.windowsUrl}" target="_blank">✓ ${m.windowsUrl.split('/').pop()}</a>`
    : '<span class="pill missing">not set</span>';
}

// ── Drop zone wiring ──────────────────────────────────────────────────────────
let files = { android: null, windows: null };

function wireDropZone(inputId, zoneId, nameId, clearId, key) {
  const input = $(inputId), zone = $(zoneId), name = $(nameId), clr = $(clearId);

  function setFile(file) {
    if (!file) return;
    files[key] = file;
    name.textContent = file.name;
    zone.classList.add('has-file');
    updateVersionPreview();
    updateBtn();
  }

  function clearFile(e) {
    e.stopPropagation();
    files[key] = null;
    name.textContent = '';
    zone.classList.remove('has-file');
    input.value = '';
    updateVersionPreview();
    updateBtn();
  }

  input.addEventListener('change', () => setFile(input.files[0]));
  clr.addEventListener('click', clearFile);

  // Drag & drop
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f) { setFile(f); }
  });
}

wireDropZone('fileAndroid', 'dropAndroid', 'nameAndroid', 'clearAndroid', 'android');
wireDropZone('fileWindows', 'dropWindows', 'nameWindows', 'clearWindows', 'windows');

function updateVersionPreview() {
  const src = files.android || files.windows;
  if (!src) { $('versionPreview').className = 'version-preview'; return; }
  const v = parseVersion(src.name);
  if (v) {
    $('detectedVer').textContent = `v${v}`;
    $('versionPreview').className = 'version-preview show';
  } else {
    $('detectedVer').textContent = 'unknown (fallback: 1.0.0)';
    $('versionPreview').className = 'version-preview show';
  }
}

function updateBtn() {
  $('uploadBtn').disabled = !files.android && !files.windows;
}

// ── Upload ────────────────────────────────────────────────────────────────────
$('uploadBtn').addEventListener('click', async () => {
  if (!files.android && !files.windows) return;

  const fd = new FormData();
  if (files.android) fd.append('android', files.android);
  if (files.windows) fd.append('windows', files.windows);
  const desc = $('description').value.trim();
  if (desc) fd.append('description', desc);

  $('uploadBtn').disabled = true;
  $('progressWrap').className = 'progress-wrap show';
  $('progressBar').style.width = '0%';
  $('progressLabel').textContent = 'Uploading…';

  try {
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/admin/upload');

      xhr.upload.addEventListener('progress', e => {
        if (e.lengthComputable) {
          const pct = Math.round(e.loaded / e.total * 100);
          $('progressBar').style.width = pct + '%';
          $('progressLabel').textContent = `Uploading… ${pct}%`;
        }
      });

      xhr.addEventListener('load', () => {
        if (xhr.status >= 200 && xhr.status < 300) resolve(JSON.parse(xhr.responseText));
        else reject(JSON.parse(xhr.responseText));
      });
      xhr.addEventListener('error', () => reject({ error: 'Network error' }));
      xhr.send(fd);
    }).then(data => {
      $('progressBar').style.width = '100%';
      $('progressLabel').textContent = 'Done!';
      applyMeta(data.meta);
      showToast(`✓ Published v${data.meta.version}`, 'success');

      // Reset form
      setTimeout(() => {
        $('progressWrap').className = 'progress-wrap';
        files = { android: null, windows: null };
        ['fileAndroid','fileWindows'].forEach(id => $(id).value = '');
        ['dropAndroid','dropWindows'].forEach(id => $(id).classList.remove('has-file'));
        ['nameAndroid','nameWindows'].forEach(id => $(id).textContent = '');
        $('description').value = '';
        $('versionPreview').className = 'version-preview';
        updateBtn();
      }, 1200);
    });

  } catch (err) {
    $('progressWrap').className = 'progress-wrap';
    showToast(`✗ ${err.error || 'Upload failed'}`, 'error');
    $('uploadBtn').disabled = false;
  }
});

// ── Reset ─────────────────────────────────────────────────────────────────────
$('resetBtn').addEventListener('click', async () => {
  if (!confirm('Clear the current release metadata? (Files stay on disk.)')) return;
  try {
    await fetch('/api/admin/reset', { method: 'DELETE' });
    applyMeta({ version: null, description: '', androidUrl: null, windowsUrl: null, updatedAt: null });
    showToast('Metadata cleared', 'success');
  } catch {
    showToast('Reset failed', 'error');
  }
});

loadMeta();
</script>
</body>
</html>
